[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradergoat"
version = "0.1.0"
description = "Research-to-paper-trading toolkit: vectorized backtests, walk-forward validation, risk controls and Monte Carlo goal analysis."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
exchange = ["ccxt>=4.4"]
dev = ["pytest>=8", "ccxt>=4.4"]

[project.scripts]
tradergoat = "tradergoat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
